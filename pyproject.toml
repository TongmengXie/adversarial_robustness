[project]
name = "adversarial-robustness"
version = "0.1.0"
description = "TextAttack-based adversarial robustness experiments and demos."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nltk==3.9.1",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "tensorflow==2.19.0",
    "tensorflow-hub==0.16.1",
    "textattack==0.3.10",
    "tf-keras==2.19.0",
    "torch==2.7.0",
    "transformers==4.51.3",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
